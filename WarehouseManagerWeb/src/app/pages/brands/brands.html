<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Nuevo" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>
<p-table #dt [value]="brands()" [paginator]="false" [rows]="rows" [columns]="cols" [first]="first"
    [totalRecords]="totalRecords" [globalFilterFields]="['name', 'description','rate', 'brandName']"
    [tableStyle]="{ 'min-width': '75rem' }" [rowHover]="true" dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products" [showCurrentPageReport]="true">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Marcas</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="width: 3rem">#</th>
            <th pSortableColumn="name" style="min-width:16rem">
                Nombre
                <p-sortIcon field="name" />
            </th>
            <th pSortableColumn="description" style="min-width:16rem">
                Descripcion
                <p-sortIcon field="description" />
            </th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-brand let-rowIndex="rowIndex">
        <tr>
            <td>{{ rowIndex }}</td>
            <td style="min-width: 16rem">{{ brand.name }}</td>
            <td style="min-width: 16rem">{{ brand.description }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editBrand(brand)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteBrand(brand)" />
            </td>
        </tr>
    </ng-template>
</p-table>
<div class="card flex justify-center">

    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="totalRecords"
        [rowsPerPageOptions]="[10, 20, 30]" currentPageReportTemplate="Showing {first} to {last} of {totalRecords}" />
</div>

<p-dialog [(visible)]="brandDialog" [style]="{ width: '450px' }"
    [header]="this.isEditing ? 'Actualizar marca':'Crear marca' " [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">

            <div>
                <label for="name" class="block font-bold mb-3">Nombre</label>
                <input type="text" pInputText id="name" [(ngModel)]="brand.name" required autofocus fluid />
                @if(submitted && !brand.name) {
                <small class="text-red-500">
                    El nombre es requerido.
                </small>
                }
            </div>
            <div>
                <label for="description" class="block font-bold mb-3">Descripción</label>
                <textarea id="description" pTextarea [(ngModel)]="brand.description" required rows="3" cols="20"
                    fluid></textarea>
            </div>
        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveBrand()" />
    </ng-template>
</p-dialog>
<p-toast />
<p-confirmdialog [style]="{ width: '450px' }" />
